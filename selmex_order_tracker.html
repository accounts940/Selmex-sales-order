<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selmex Order Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#14284b;--red:#c8102e;--bg:#f3f5f9;--ink:#1c2433;--mut:#667085;--line:#dbe0ea;--ok:#1f8a4c;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.hide{display:none!important}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--red);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{height:36px;background:#fff;padding:3px;border-radius:4px}
header.top h1{font-size:18px;margin:0;flex:1}
header.top span{font-size:13px;opacity:.9}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--red);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid #ffffff80;color:#fff}
button.alt{background:var(--navy)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3b82f6;outline-offset:1px}
nav{display:flex;gap:4px;padding:12px 20px 0;flex-wrap:wrap}
nav button{background:#fff;color:var(--navy);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}
nav button.on{background:var(--navy);color:#fff}
main{padding:16px 20px 40px;max-width:1200px;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:26px;color:var(--navy)}
.kpi.r{border-left-color:var(--red)}.kpi.r b{color:var(--red)}
.kpi small{color:var(--mut)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#eef1f7;color:var(--navy);font-size:13px}
td.n{text-align:right}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e8ecf3;color:var(--navy)}
.b.inproduction{background:#fff3d6;color:var(--warn)}
.b.completed,.b.done{background:#dff3e6;color:var(--ok)}
.b.late{background:#fde2e6;color:var(--red)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select,.f input,.f select,td select,td input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.bar input{flex:1;min-width:200px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.card>header{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:#f8f9fc;border-bottom:1px solid var(--line)}
.card>header strong{color:var(--navy);font-size:15px}
.card>header span{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f label{display:block;font-weight:600;margin-bottom:4px;color:var(--navy)}
.f input,.f select{width:100%}
.irow input{width:100%}
.empty{color:var(--mut);padding:12px 0}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#login .panel{padding:24px}
#login .f{margin-bottom:12px}
#login button{width:100%}
.msg{color:var(--red);min-height:20px;margin-top:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<section id="login">
  <div class="panel">
    <h2>Selmex Order Tracker</h2>
    <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button id="go">Sign in</button>
    <div class="msg" id="lmsg"></div>
  </div>
</section>

<div id="app" class="hide">
  <header class="top">
    <img id="logo" class="hide" alt="Selmex logo">
    <h1>Selmex Order Tracker</h1>
    <span id="who"></span>
    <button class="ghost" id="refresh">Refresh</button>
    <button class="ghost" id="out">Sign out</button>
  </header>
  <nav id="tabs">
    <button data-t="dash" class="on">Dashboard</button>
    <button data-t="orders">Orders</button>
    <button data-t="new" id="tnew">New order</button>
  </nav>
  <main>
    <section id="dash">
      <div class="kpis" id="kpis"></div>
      <div class="panel"><h2>Open orders by delivery date</h2><div class="scroll" id="pend"></div></div>
    </section>

    <section id="orders" class="hide">
      <div class="bar">
        <input id="q" placeholder="Search PO ID, company, employee or item" aria-label="Search orders">
        <select id="fs" aria-label="Filter by status"><option value="">All statuses</option><option>Pending</option><option>In Production</option><option>Completed</option></select>
      </div>
      <div id="olist"></div>
    </section>

    <section id="new" class="hide">
      <div class="panel">
        <h2>New sales order</h2>
        <div class="grid f">
          <div><label for="po">PO ID / code</label><input id="po"></div>
          <div><label for="co">Company name</label><input id="co"></div>
          <div><label for="emp">Assigned employee</label><select id="emp"></select></div>
          <div><label for="od">Order date</label><input id="od" type="date"></div>
          <div><label for="dd">Delivery date</label><input id="dd" type="date"></div>
        </div>
      </div>
      <div class="panel">
        <h2>Items</h2>
        <div class="scroll"><table><thead><tr><th>Item description</th><th>Micron (in words)</th><th>Size</th><th>Quantity</th><th></th></tr></thead><tbody id="irows"></tbody></table></div>
        <p><button class="alt" id="addrow" type="button">Add item</button></p>
      </div>
      <button id="save">Save order</button>
      <div class="msg" id="nmsg"></div>
    </section>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
// ===== SETTINGS: change these two lines =====
const SUPABASE_URL = "https://clyqzlyltamuuqfnrvys.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_KEY_HERE";
const LOGO_URL = ""; // optional: paste a link to the Selmex logo image
// ============================================
const SALES = ["Nitish Gupta","Hanumant Singh","Manjeet Singh","Preeti","Shivanand Goand"];
const ISTAT = ["Pending","In Production","Done"];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, orders = [], items = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}) : "-";
const badge = s => `<span class="b ${String(s).replace(/\s/g, "").toLowerCase()}">${esc(s)}</span>`;
const canNew = () => me && (me.role === "Sales" || me.role === "Management");
const canUpd = () => me && (me.role === "Production" || me.role === "Management");
const isLate = o => o.delivery_date && o.delivery_date < today() && o.status !== "Completed";
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 2500); }

// ---- sign in ----
async function boot() {
  const { data } = await db.auth.getSession();
  if (data.session) start(data.session.user.email); else $("login").classList.remove("hide");
}
$("go").onclick = async () => {
  $("lmsg").textContent = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { $("lmsg").textContent = "Sign in failed. Check your email and password."; return; }
  start(data.user.email);
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };
$("refresh").onclick = async () => { await load(); toast("Refreshed"); };

async function start(email) {
  const { data, error } = await db.from("profiles").select("name,email,role").eq("email", email.toLowerCase()).maybeSingle();
  if (error || !data) {
    await db.auth.signOut();
    $("login").classList.remove("hide"); $("app").classList.add("hide");
    $("lmsg").textContent = "No role is set for this email. Ask Management to add you.";
    return;
  }
  me = data;
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("who").textContent = me.name + " (" + me.role + ")";
  if (LOGO_URL) { $("logo").src = LOGO_URL; $("logo").classList.remove("hide"); }
  if (!canNew()) $("tnew").classList.add("hide");
  $("emp").innerHTML = SALES.map(n => `<option>${esc(n)}</option>`).join("");
  $("od").value = today();
  addRow(); addRow();
  await load();
}

// ---- data ----
async function load() {
  const [o, i] = await Promise.all([
    db.from("orders").select("*").order("created_at", { ascending: false }),
    db.from("order_items").select("*").order("id")
  ]);
  if (o.error || i.error) { toast("Could not load data: " + (o.error || i.error).message); return; }
  orders = o.data; items = i.data;
  renderDash(); renderOrders();
}

function renderDash() {
  const n = s => orders.filter(o => o.status === s).length;
  const late = orders.filter(isLate).length;
  $("kpis").innerHTML =
    `<div class="kpi"><b>${orders.length}</b><small>Total orders</small></div>` +
    `<div class="kpi"><b>${n("Pending")}</b><small>Pending</small></div>` +
    `<div class="kpi"><b>${n("In Production")}</b><small>In production</small></div>` +
    `<div class="kpi"><b>${n("Completed")}</b><small>Completed</small></div>` +
    `<div class="kpi r"><b>${late}</b><small>Overdue</small></div>`;
  const open = orders.filter(o => o.status !== "Completed")
    .sort((a, b) => (a.delivery_date || "9999").localeCompare(b.delivery_date || "9999"));
  $("pend").innerHTML = open.length
    ? `<table><thead><tr><th>Delivery date</th><th>PO ID</th><th>Company</th><th>Employee</th><th>Status</th></tr></thead><tbody>` +
      open.map(o => `<tr><td>${fmt(o.delivery_date)} ${isLate(o) ? '<span class="b late">Overdue</span>' : ""}</td><td>${esc(o.po_id)}</td><td>${esc(o.company_name)}</td><td>${esc(o.assigned_employee)}</td><td>${badge(o.status)}</td></tr>`).join("") +
      `</tbody></table>`
    : '<p class="empty">No open orders. Add one from the New order tab.</p>';
}

function renderOrders() {
  const q = $("q").value.toLowerCase(), st = $("fs").value;
  const list = orders.filter(o => (!st || o.status === st) && (!q ||
    [o.po_id, o.company_name, o.assigned_employee].join(" ").toLowerCase().includes(q) ||
    items.some(i => i.order_id === o.id && (i.item_description || "").toLowerCase().includes(q))));
  $("olist").innerHTML = list.length ? list.map(card).join("") : '<p class="empty">No orders match. Change the search or the status filter.</p>';
}
function card(o) {
  const rows = items.filter(i => i.order_id === o.id).map(i => `<tr><td>${esc(i.item_description)}</td><td>${esc(i.micron)}</td><td>${esc(i.size)}</td><td class="n">${esc(i.quantity)}</td><td>` +
    (canUpd() ? `<select data-item="${i.id}" aria-label="Item status">${ISTAT.map(s => `<option${s === i.item_status ? " selected" : ""}>${s}</option>`).join("")}</select>` : badge(i.item_status)) + `</td></tr>`).join("");
  return `<article class="card"><header><strong>${esc(o.po_id)}</strong><span>${esc(o.company_name)}</span><span>Employee: ${esc(o.assigned_employee)}</span><span>Ordered: ${fmt(o.order_date)}</span><span>Delivery: ${fmt(o.delivery_date)}</span>${isLate(o) ? '<span class="b late">Overdue</span>' : ""}${badge(o.status)}</header>` +
    `<div class="scroll"><table><thead><tr><th>Item</th><th>Micron</th><th>Size</th><th>Qty</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">No items</td></tr>'}</tbody></table></div></article>`;
}
$("q").oninput = renderOrders; $("fs").onchange = renderOrders;

// ---- production: change item status ----
$("olist").onchange = async e => {
  const sel = e.target.closest("select[data-item]"); if (!sel) return;
  const it = items.find(x => x.id == sel.dataset.item), status = sel.value;
  const { error } = await db.from("order_items").update({ item_status: status }).eq("id", it.id);
  if (error) { toast("Not saved: " + error.message); sel.value = it.item_status; return; }
  it.item_status = status;
  const all = items.filter(x => x.order_id === it.order_id);
  const os = all.every(x => x.item_status === "Done") ? "Completed" : all.some(x => x.item_status !== "Pending") ? "In Production" : "Pending";
  const o = orders.find(x => x.id === it.order_id);
  if (o.status !== os) {
    const r = await db.from("orders").update({ status: os }).eq("id", o.id);
    if (!r.error) o.status = os;
  }
  await db.from("activity_log").insert({ order_id: o.id, action: `${it.item_description} marked ${status}`, done_by: me.name });
  toast("Saved"); renderDash(); renderOrders();
};

// ---- new order ----
function addRow() {
  const tr = document.createElement("tr"); tr.className = "irow";
  tr.innerHTML = `<td><input class="d" aria-label="Item description"></td><td><input class="m" placeholder="e.g. Fifty" aria-label="Micron"></td><td><input class="s" placeholder="48mm x 65m" aria-label="Size"></td><td><input class="q" type="number" min="0" step="any" aria-label="Quantity"></td><td><button type="button" class="alt" aria-label="Remove item">Remove</button></td>`;
  tr.querySelector("button").onclick = () => { if ($("irows").children.length > 1) tr.remove(); };
  $("irows").appendChild(tr);
}
$("addrow").onclick = addRow;
$("save").onclick = async () => {
  const msg = $("nmsg"); msg.textContent = "";
  const po = $("po").value.trim(), co = $("co").value.trim();
  const rows = [...document.querySelectorAll(".irow")].map(r => ({
    item_description: r.querySelector(".d").value.trim(), micron: r.querySelector(".m").value.trim(),
    size: r.querySelector(".s").value.trim(), quantity: r.querySelector(".q").value
  })).filter(r => r.item_description || r.quantity);
  if (!po || !co || !$("od").value) { msg.textContent = "Enter the PO ID, company name and order date."; return; }
  if (!rows.length || rows.some(r => !r.item_description || !(Number(r.quantity) > 0))) { msg.textContent = "Each item needs a description and a quantity above 0."; return; }
  $("save").disabled = true;
  const { data: o, error } = await db.from("orders").insert({
    po_id: po, company_name: co, assigned_employee: $("emp").value,
    order_date: $("od").value, delivery_date: $("dd").value || null
  }).select().single();
  if (error) { msg.textContent = "Order not saved: " + error.message; $("save").disabled = false; return; }
  const r2 = await db.from("order_items").insert(rows.map(r => ({ ...r, quantity: Number(r.quantity), order_id: o.id })));
  if (r2.error) { msg.textContent = "Order saved but items failed: " + r2.error.message + ". Ask Management to delete order " + po + " and enter it again."; $("save").disabled = false; await load(); return; }
  await db.from("activity_log").insert({ order_id: o.id, action: "Order created", done_by: me.name });
  $("po").value = ""; $("co").value = ""; $("dd").value = ""; $("irows").innerHTML = ""; addRow(); addRow();
  $("save").disabled = false; toast("Order saved"); await load(); show("orders");
};

// ---- tabs ----
function show(t) {
  ["dash", "orders", "new"].forEach(x => $(x).classList.toggle("hide", x !== t));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
}
$("tabs").onclick = e => { const b = e.target.closest("button[data-t]"); if (b) show(b.dataset.t); };

boot();
</script>
</body>
</html>
